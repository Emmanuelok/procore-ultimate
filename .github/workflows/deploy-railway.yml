name: Deploy to Railway

# Why this exists
# ---------------
# Railway deploys are normally driven by its own GitHub integration: connect the
# repo once in the Railway dashboard and every push to the tracked branch builds
# automatically. That is still the simplest route and this workflow is not a
# replacement for it.
#
# This is the fallback for two situations the integration does not cover:
#   1. The repo is not connected in the dashboard (or was disconnected after the
#      monorepo-split misconfiguration documented in docs/deployment.md §2.4).
#   2. A deploy needs to be triggered deliberately rather than on every push —
#      hence workflow_dispatch below.
#
# It is INERT until an operator adds a RAILWAY_TOKEN secret. Without it the job
# does not fail the build, it skips with a message: a missing secret is a
# configuration state, not a broken pipeline.
#
# Getting the token: Railway dashboard → project → Settings → Tokens → create a
# project token, then add it at GitHub → repo Settings → Secrets and variables →
# Actions → New repository secret, named RAILWAY_TOKEN. A project token is
# scoped to one project; prefer it over an account token.

# WHAT CHANGED, AND WHY
# ---------------------
# The comment below the job used to say "deploy only what already passed CI on
# this exact commit" and nothing enforced it: the job triggered on `push`, in
# parallel with ci.yml, so a commit whose tests were still running — or had
# already failed — was deployed to production the moment RAILWAY_TOKEN existed.
# The concurrency group cancelled a SUPERSEDED deploy; it never cancelled a
# FAILING one.
#
# It now triggers on the COMPLETION of the CI workflow and refuses to run
# unless that run concluded `success`, and it checks out the exact commit CI
# tested (`workflow_run.head_sha`) rather than whatever the branch tip happens
# to be by then.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service name (leave blank for the project default)"
        required: false
        type: string
      ref:
        description: "Commit or branch to deploy (defaults to this workflow's checkout)"
        required: false
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  # One deploy at a time per target. A superseded deploy is cancelled rather
  # than racing the newer one to the same service.
  group: railway-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # THE GATE. A manual dispatch is a deliberate act by an operator and runs;
    # an automatic run happens only when the CI run that triggered it passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI actually tested, not the branch tip — between CI
          # finishing and this job starting, the branch can have moved.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Say what is being deployed
        run: |
          echo "commit:  ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "branch:  ${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "trigger: ${{ github.event_name }}"
          echo "ci:      ${{ github.event.workflow_run.conclusion || 'manual dispatch (not gated on CI)' }}"

      - name: Check for a deploy token
        id: guard
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Railway deploy skipped::No RAILWAY_TOKEN secret is set, so there is nothing to deploy to. Add one under Settings → Secrets and variables → Actions to enable this workflow. The build itself is unaffected."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Railway CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm i -g @railway/cli

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          SERVICE="${{ github.event.inputs.service }}"
          # --ci makes the CLI stream build logs and exit non-zero on failure
          # instead of detaching, so a failed deploy fails this job.
          if [ -n "$SERVICE" ]; then
            railway up --ci --service "$SERVICE"
          else
            railway up --ci
          fi

      - name: Report
        if: steps.guard.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deployed ${{ github.event.workflow_run.head_sha || github.sha }}."
          echo "Migrations 0000 onward apply automatically at container boot; the"
          echo "release is live once /api/v1/health/ready answers 200."
          railway status || true

      # The release is not a release until something has driven it. The smoke
      # script registers a throwaway account, uploads and downloads a file
      # (which is the only way to prove the storage wiring) and verifies the
      # ledger chain. Set RAILWAY_PUBLIC_URL to enable it; without the variable
      # the step says so and skips rather than pretending to have checked.
      - name: Post-deploy smoke test
        if: steps.guard.outputs.configured == 'true'
        env:
          BASE_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "::notice title=Smoke test skipped::Set the repository variable RAILWAY_PUBLIC_URL to the deployment's public origin to run scripts/post-deploy-smoke.sh after every deploy."
            exit 0
          fi
          # Railway needs a moment to swap the running container over.
          sleep 20
          ./scripts/post-deploy-smoke.sh "$BASE_URL"
