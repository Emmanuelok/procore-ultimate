version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: constructos
      POSTGRES_PASSWORD: constructos
      POSTGRES_DB: constructos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
